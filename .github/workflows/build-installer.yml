name: Build WPF Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # релиз создаётся только на теги вида v1.2.3
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # позволяет запускать вручную

permissions:
  contents: write   # нужно для создания GitHub Release

jobs:
  build:
    runs-on: windows-latest   # обязательна Windows для WPF и Inno Setup

    steps:
      # 1. Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка .NET SDK (подберите версию под ваш проект)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # замените на нужную, например '6.0.x', '7.0.x'

      # 3. Кэширование NuGet пакетов (ускоряет последующие сборки)
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Запуск вашего скрипта сборки
      #    Inno Setup 6 уже предустановлен на windows-latest;
      #    если его не окажется, скрипт доустановит через winget
      - name: Run build-setup.ps1
        shell: powershell
        run: |
          # Разрешаем выполнение скриптов
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          # Запускаем скрипт (при необходимости передайте параметры, например -Configuration Release)
          ./scripts/build-setup.ps1 -Configuration Release

      # 5. Публикация артефакта (установщика)
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSHTunnel4Win-setup.zip
          path: scripts/SSHTunnel4Win-setup.exe
          if-no-files-found: error   # завершится ошибкой, если файл не найден
 
      - name: Create Release and Upload Asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')  # запускать только на теги
        uses: softprops/action-gh-release@v2
        with:
          working_directory: scripts
          files: |
            SSHTunnel4Win-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
